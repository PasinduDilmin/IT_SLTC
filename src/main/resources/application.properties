# ==============================================================================
# SLTC-IT - Campus Enterprise IT Asset Management System
# ==============================================================================
spring.application.name=sltc-it
server.port=8080

# Active profile: 'mysql' for local MySQL database, or 'dev' for in-memory H2
spring.profiles.active=mysql

# Common JPA / Hibernate settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Colombo

# Logging Configuration
logging.level.lk.sltc.nexusitam=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


